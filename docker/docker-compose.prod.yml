version: '3.9'

# ─────────────────────────────────────────────────────────
# DevSight — Production Simulation Docker Compose
# Mimics the Vercel + API deployment topology locally.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up --build
# ─────────────────────────────────────────────────────────

services:
  frontend:
    build:
      context: ../client
      dockerfile: ../docker/Dockerfile.client
      target: production
    networks:
      - devsight-prod-network

  api:
    build:
      context: ../server
      dockerfile: ../docker/Dockerfile.server
      target: production
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - CLIENT_URL=http://localhost
    env_file:
      - ../.env.local
    networks:
      - devsight-prod-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - api
    networks:
      - devsight-prod-network

networks:
  devsight-prod-network:
    driver: bridge
